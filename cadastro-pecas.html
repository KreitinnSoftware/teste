<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Eletrônica Rayos - Cadastro de peças</title><link rel="stylesheet" href="rayos.css"><link rel="stylesheet" href="cadastro-pecas.css"></head><body><header><b>⚡ Eletrônica Rayos</b><nav><a href="painel adm.html">Painel ADM</a></nav></header><main><section class="card"><h1>Cadastro e previsão de peças</h1><p class="mu">Registre peças solicitadas, acompanhe a previsão de chegada e, se necessário, vincule uma OS ao recebimento.</p><form id="pieceForm"><input id="pieceId" type="hidden"><div class="grid"><label>Peça<input id="pieceName" name="name" required placeholder="Ex.: Placa da fonte"></label><label>Fornecedor<input id="pieceSupplier" name="supplier" placeholder="Nome do fornecedor"></label><label>Quantidade<input id="pieceQuantity" name="quantity" type="number" min="1" required value="1"></label><label>Previsão de chegada<input id="pieceExpectedDate" name="expectedDate" type="date" required></label><label>Status<select id="pieceStatus" name="status"><option>Solicitada</option><option>Em trânsito</option><option>Recebida</option><option>Cancelada</option></select></label><label>Produto/OS relacionado (opcional)<select id="pieceOrder" name="orderId"></select></label></div><div class="actions"><button id="saveButton" class="btn">Cadastrar peça</button><button id="cancelButton" class="btn g" type="button" hidden>Cancelar edição</button></div></form></section><section class="card"><h2>Peças cadastradas</h2><div class="tw"><table><thead><tr><th>Peça</th><th>Qtd.</th><th>Previsão</th><th>Status</th><th>Produto/OS</th><th>Ações</th></tr></thead><tbody id="piecesBody"></tbody></table></div></section></main><script src="cadastro-pecas.js"></script></body></html>
